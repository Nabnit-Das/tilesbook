project_id = "tilebook"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
email_sent = 12

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "TileBook email verification"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "TileBook email verification"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.recovery]
subject = "TileBook password recovery"
content_path = "./supabase/templates/recovery.html"

[auth.sms]
enable_signup = false
